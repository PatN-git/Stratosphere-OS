[pytest]
# Single source of truth for Python test discovery. Both CI and `scripts/check.sh`
# run `pytest` so local == CI. New test_*.py files and test_* functions are
# auto-collected — no need to wire them into CI or a __main__ block.
testpaths = tests
markers =
    integration: needs network/auth or live services (Jules live, install-harness L2, real marketplace); excluded from the default run. Run with `-m integration`.
addopts = -m "not integration"
